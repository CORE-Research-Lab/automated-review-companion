version: "3"
services:

  frontend:
    container_name: frontend
    build:
      context: ./publication-scraper-web
      dockerfile: Dockerfile
    networks:
      backend:
        aliases:
          - frontend
    ports:
      - "3000:3000"
    env_file:
      - ./publication-scraper-web/.env
    restart: always

  server:
    container_name: server
    build:
      context: ./publication-scraper-backend
      dockerfile: Dockerfile
    networks:
      backend:
        aliases:
          - server
    ports:
      - "8000:8000"
    restart: always

  nginx-proxy:
    container_name: nginx
    image: nginx
    restart: unless-stopped
    networks:
      backend:
        aliases:
          - nginx
    depends_on:
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

networks:
  backend:
